[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyinkvision"
version = "0.1.0"
description = "Async client for the local API of inkVision devices (Atmos Smart Clock, Frame, Bento Bar)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HomeBrainz" }]
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.9"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/HomeBrainz/pyinkvision"
Issues = "https://github.com/HomeBrainz/pyinkvision/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-aiohttp>=1.0", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.5"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=pyinkvision --cov-report=term-missing --cov-fail-under=100"

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM", "RUF", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
